<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Initial application</title>
	<link rel="icon" type="image/svg+xml" href="./assets/image/icon/html5.svg">

	<!-- Application components -->
  <link rel="stylesheet" 
				href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
	<link rel="stylesheet" 
				href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="./css/app.css">
	<style>
		.page-title {
			color: red;
		}
	</style>
</head>
<body>

	<!-- Page container -->
	<div class="page-container d-flex flex-column min-vh-100">

		<!-- Header -->
		<header class="sticky-top">

			<!-- Navbar -->
			<nav class="navbar navbar-expand-sm bg-body-tertiary">

				<!-- Container -->
				<div class="container-fluid">

					<!-- Hamburger icon -->
					<button class="navbar-toggler ms-auto" 
									type="button" 
									data-bs-toggle="collapse"
									data-bs-target="#navbar_content" 
									aria-controls="navbar_content" 
									aria-expanded="false"
									aria-label="Toggle navigation">
						<span class="navbar-toggler-icon"></span>
					</button>

					<!-- Navbar content -->
					<div id="navbar_content" 
							 class="collapse navbar-collapse mt-3 mt-sm-0">

						<!-- Navbar content LEFT -->
						<ul class="navbar-nav me-auto ms-0 ms-sm-3">

							<!-- Home -->
							<li class="nav-item mx-1">
								<a class="nav-link active" 
									 href="./index.html">
									<span class="text-capitalize text-small-caps">
										<i class="fa-solid fa-house me-1"></i>
										<span>home</span>
									</span>
								</a>
							</li>

							<!-- Page1 -->
							<li class="nav-item mx-1">
								<a class="nav-link" 
									 href="./html/page1.html">
									<span class="text-capitalize text-small-caps">
										<i class="fa-solid fa-face-smile me-1"></i>
										<span>page1</span>
									</span>
								</a>
							</li>

							<!-- Page2 -->
							<li class="nav-item mx-1">
								<a class="nav-link" 
									 href="./html/page2.html">
									<span class="text-capitalize text-small-caps">
										<i class="fa-solid fa-globe me-1"></i>
										<span>page2</span>
									</span>
								</a>
							</li>
						</ul>

						<!-- Navbar content RIGHT -->
						<ul class="navbar-nav ms-auto me-0 me-sm-3">

							<!-- Theme -->
							<li class="nav-item mx-1">
								<button type="button"
												class="nav-link border-0 bg-transparent"
												onclick="methods.toggleTheme()"
												title="Change theme"
												aria-label="Change theme"
												data-bs-toggle="collapse"
												data-bs-target=".navbar-collapse.show">
									<span class="text-capitalize text-small-caps">
										<i id="theme-icon" class="fa-solid me-1 me-sm-0"></i>
										<span class="d-sm-none">
											change theme
										</span>
									</span>
								</button>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>

		<!-- Main -->
		<main class="position-relative flex-fill d-flex flex-column justify-content-center">

			<div class="container">
				<h1 class="text-center text-capitalize display-1">
					welcome!
				</h1>

				<h4 class="page-title text-center text-capitalize display-4">
					<i class="fa-solid fa-house me-1"></i>
					<span>home</span>
				</h4>
			</div>
		</main>

		<!-- Footer -->
		<footer>
			<div class="container-fluid bg-body-tertiary px-3 pt-2">
        <p class="fw-lighter fs-sm mb-2 text-center">
          &copy; Copyright&nbsp;&nbsp;2021-<span id="current-year"></span>
          Keri Informatics, Makó
        </p>
    	</div>
		</footer>
	</div>

  <!-- Application components -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
	<script src="./js/app.js"></script>
</body>
</html>
